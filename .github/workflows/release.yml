name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    name: Build linux/amd64 binary
    # Pinned to an older runner on purpose: the binary's glibc floor is set by
    # the build host, so 22.04 (glibc 2.35) keeps it runnable on Debian 12 /
    # Ubuntu 22.04 and newer. Bump only if you also raise the supported floor.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen, runtime deps only)
        run: uv sync --frozen

      - name: Build single-file binary
        # cffi + _cffi_backend are required transitively by PyNaCl; PyInstaller
        # does not pick up the _cffi_backend extension on its own, so collect it
        # explicitly or the frozen `run` command dies importing nacl.
        run: >
          uv run --with pyinstaller pyinstaller --onefile --name sum-agent
          --collect-submodules sum_agent --collect-all nacl --collect-all psutil
          --collect-all cffi --hidden-import _cffi_backend
          --log-level WARN packaging/pyinstaller_entry.py

      - name: Smoke-test the binary
        run: |
          ./dist/sum-agent version
          ./dist/sum-agent inventory > /dev/null
          ./dist/sum-agent enroll || test $? -eq 2
          # Exercise the runner -> dispatch -> verify -> nacl -> cffi import
          # chain. Point at a dummy URL + empty state so `run` reaches the
          # handled "not enrolled" path (clean exit, no network). A missing
          # frozen module (e.g. _cffi_backend) crashes the import here instead.
          # Match only import errors: an unhandled config error would also print
          # PyInstaller's "Failed to execute script", so we must not grep for it.
          tmpstate="$(mktemp -d)"
          out="$(SUM_AGENT_SERVER_URL=https://localhost SUM_AGENT_STATE_DIR="$tmpstate" \
            ./dist/sum-agent run 2>&1 || true)"
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qiE "ModuleNotFoundError|No module named|ImportError|cannot open shared object"; then
            echo "FATAL: frozen import chain is broken"; exit 1
          fi
          echo "import-chain smoke OK"

      - name: Stage artifact with versioned name and checksum
        run: |
          mkdir -p out
          cp dist/sum-agent "out/sum-agent-${GITHUB_REF_NAME}-linux-amd64"
          ( cd out && sha256sum "sum-agent-${GITHUB_REF_NAME}-linux-amd64" \
              > "sum-agent-${GITHUB_REF_NAME}-linux-amd64.sha256" )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/sum-agent-${{ github.ref_name }}-linux-amd64
            out/sum-agent-${{ github.ref_name }}-linux-amd64.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
