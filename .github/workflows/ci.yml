name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen)
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Byte-compile (syntax)
        run: uv run python -m compileall -q src

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen)
        run: uv sync --all-extras --frozen

      - name: mypy
        run: uv run mypy src/sum_agent

  test:
    name: Tests (unit, no external services)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen)
        run: uv sync --all-extras --frozen

      # The agent's tests are unit-scoped: no database or container runtime
      # required. The guard skips cleanly while the suite is still being
      # hand-implemented; once test files exist, failures fail the job.
      - name: Run tests
        run: |
          if find tests -name "test_*.py" -type f 2>/dev/null | grep -q .; then
            uv run pytest -q
          else
            echo "No test files yet; skipping until the suite lands."
          fi
