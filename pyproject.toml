[project]
name = "sum-agent"
version = "0.1.0"
description = "OpenSUM pull-based agent: inventory, job execution, signed-plugin runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "psutil>=6.1",
    "pynacl>=1.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=6.1",
]

[project.scripts]
sum-agent = "sum_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sum_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "S603", "S607"]  # S603/S607: subprocess + partial path are intentional for system tools

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]